const SIDE = "A";
let idx = 0;

const topic = document.getElementById('topic');
const count = document.getElementById('count');
const messages = document.getElementById('messages');
const search = document.getElementById('search');
const toast = document.getElementById('toast');
const fallback = document.getElementById('fallback');

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render() {
  const d = DATA[idx];
  count.textContent = `第 ${d.num} 组 · ${d.num} / ${DATA.length}`;
  topic.textContent = `第${d.num}组｜${d.topic}`;
  messages.innerHTML = d[SIDE].map((s,i) =>
    `<div class="msg"><span>${i+1}</span><div class="bubble">${escapeHtml(s)}</div><button class="copy" data-i="${i}">复制</button></div>`
  ).join('');
  document.querySelectorAll('.copy').forEach(b => b.onclick = () => copyText(d[SIDE][+b.dataset.i], b));
  document.getElementById('prev').disabled = idx === 0;
  document.getElementById('nextTop').disabled = idx === DATA.length-1;
  window.scrollTo(0,0);
}

function showToast(t) {
  toast.textContent = t;
  toast.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => toast.style.display='none', 1800);
}

async function copyText(text, btn) {
  // 1. 优先使用 Clipboard API（HTTPS/Safari 正常时可直接复制）
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      btn.textContent = '已复制 ✓';
      showToast('已复制');
      setTimeout(() => btn.textContent='复制', 1000);
      return;
    }
  } catch(e) {}

  // 2. iPhone 本地 HTML / 非安全页面：使用用户点击触发的传统复制方式
  try {
    fallback.value = text;
    fallback.style.opacity = '1';
    fallback.focus();
    fallback.select();
    fallback.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    fallback.style.opacity = '0';
    if (ok) {
      btn.textContent = '已复制 ✓';
      showToast('已复制');
      setTimeout(() => btn.textContent='复制', 1000);
      return;
    }
  } catch(e) {}

  // 3. 最后兜底：选中文字，让 iPhone 系统显示“拷贝/复制”
  fallback.value = text;
  fallback.style.opacity = '1';
  fallback.focus();
  fallback.select();
  fallback.setSelectionRange(0, text.length);
  showToast('文字已选中，请点系统菜单里的“拷贝/复制”');
}

document.getElementById('prev').onclick=()=>go(idx-1);
document.getElementById('nextTop').onclick=()=>go(idx+1);
document.getElementById('nextBottom').onclick=()=>go(idx+1);
document.getElementById('copyAll').onclick=()=>copyText(DATA[idx][SIDE].join('\n'), document.getElementById('copyAll'));

function go(n) {
  idx=Math.max(0,Math.min(DATA.length-1,n));
  render();
}

search.addEventListener('input', function() {
  const q=this.value.trim().toLowerCase();
  if(!q) return;
  const found=DATA.findIndex(d => (`${d.num} ${d.topic} ${d.A.join(' ')} ${d.B.join(' ')}`).toLowerCase().includes(q));
  if(found>=0) go(found);
});

render();
</script>
